spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doq}
    username: ${DB_USERNAME:doq}
    password: ${DB_PASSWORD:doq}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      # 기본값 1MB — PDF·이미지 원본 문서는 그보다 크다
      max-file-size: 20MB
      max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop
      # 컨테이너 준비 대기 타임아웃
      readiness:
        wait: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

# 애플리케이션 설정
app:
  storage:
    local:
      # 업로드 원본 파일 저장 루트 (로컬 파일시스템)
      root: ${STORAGE_LOCAL_ROOT:./data/uploads}
  ingestion:
    parse:
      # 취합 파일 파싱 워커 풀 — 업로드 응답 이후 별도 스레드에서 파싱한다
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
    events:
      # 세션 현황 SSE — 연결 유지 시간과 살아있음 표시 주기 (프록시 idle 타임아웃보다 짧게)
      timeout-millis: 1800000
      heartbeat-millis: 15000
      queue-capacity: 1000
