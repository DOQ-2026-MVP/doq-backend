spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doq}
    username: ${DB_USERNAME:doq}
    password: ${DB_PASSWORD:doq}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop
      # 컨테이너 준비 대기 타임아웃
      readiness:
        wait: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

# 애플리케이션 설정
app:
  storage:
    local:
      # 업로드 원본 파일 저장 루트 (로컬 파일시스템)
      root: ${STORAGE_LOCAL_ROOT:./data/uploads}
