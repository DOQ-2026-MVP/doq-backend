spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doq}
    username: ${DB_USERNAME:doq}
    password: ${DB_PASSWORD:doq}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      # 기본값 1MB — PDF·이미지 원본 문서는 그보다 크다
      max-file-size: 20MB
      max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop
      # 컨테이너 준비 대기 타임아웃
      readiness:
        wait: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

# 애플리케이션 설정
app:
  storage:
    local:
      # 업로드 원본 파일 저장 루트 (로컬 파일시스템)
      root: ${STORAGE_LOCAL_ROOT:./data/uploads}
  ingestion:
    parse:
      # 취합 파일 파싱 워커 풀 — 업로드 응답 이후 별도 스레드에서 파싱한다
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
    events:
      # 세션 현황 SSE — 연결 유지 시간과 살아있음 표시 주기 (프록시 idle 타임아웃보다 짧게)
      timeout-millis: 1800000
      heartbeat-millis: 15000
      queue-capacity: 1000
    ocr:
      # 이미지 원본에서 글자를 뽑는 외부 실행 파일. 없으면 이미지는 보관만 된다(부팅은 정상).
      command: ${OCR_COMMAND:tesseract}
      languages: ${OCR_LANGUAGES:kor+eng}
      timeout-seconds: 60
  structuring:
    handoff:
      # 구조화 결과 → 검수 인박스 인계 워커 풀 (요청 트랜잭션에서 떼어냄)
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100

# 원본 문서(PDF) 항목 추출 — 추가 요건
# api-key 는 여기 두지 않는다: 기본값을 주면 빈 값이라도 "존재"로 잡혀 오히려 켜진다.
# 환경변수 ANTHROPIC_API_KEY 가 있을 때만(relaxed binding → anthropic.api-key) 추출기가 활성화된다.
anthropic:
  # 짧은 텍스트에서 정해진 7필드를 뽑는 구조화 작업이라 작은 모델로 충분하다.
  # 추출 품질이 아쉬우면 ANTHROPIC_MODEL 로 올린다.
  model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:8000}
