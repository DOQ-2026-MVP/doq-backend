spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doq}
    username: ${DB_USERNAME:doq}
    password: ${DB_PASSWORD:doq}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop
      # 컨테이너 준비 대기 타임아웃
      readiness:
        wait: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

# 애플리케이션 설정
app:
  storage:
    local:
      # 업로드 원본 파일 저장 루트 (로컬 파일시스템)
      root: ${STORAGE_LOCAL_ROOT:./data/uploads}

# Anthropic (PDF 원본 직접 추출 — 추가 요건)
# 환경변수 ANTHROPIC_API_KEY가 있을 때만(relaxed binding → anthropic.api-key) 추출기가 활성화된다.
# 여기서 api-key에 기본값을 주면 빈 값이라도 "존재"로 잡혀 오히려 켜지므로, 키는 env로만 주입한다.
anthropic:
  model: ${ANTHROPIC_MODEL:claude-opus-4-8}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:8000}
